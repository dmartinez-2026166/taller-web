spring.application.name=taller-web
server.port=8080

# ---------------- Base de datos ----------------
# Puede dejar estos valores aquí o definirlos como variables de entorno (DB_USER, DB_PASSWORD).
allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=America/Guatemala&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# ---------------- Usuarios base ----------------
# Se crean automáticamente al iniciar si no existen (la contraseña se guarda con BCrypt).
# Cambie nombre, usuario y contraseña. Una contraseña que empiece con "CAMBIAR" NO crea el usuario.
app.usuarios.administrador.nombre=Henry Martinez
app.usuarios.administrador.usuario=admin
app.usuarios.administrador.password=hmartinez

app.usuarios.empleado.nombre=Cristopher Martinez
app.usuarios.empleado.usuario=empleado
app.usuarios.empleado.password=cmartinez



spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
